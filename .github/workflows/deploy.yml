name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR builds get their own group so they can never cancel a queued deploy.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check MAKONOME_READ_TOKEN
        env:
          MAKONOME_READ_TOKEN: ${{ secrets.MAKONOME_READ_TOKEN }}
        run: |
          if [ -z "$MAKONOME_READ_TOKEN" ]; then
            echo "::error::MAKONOME_READ_TOKEN missing or expired, see README"
            exit 1
          fi

      - name: Checkout app repo (release notes)
        uses: actions/checkout@v4
        with:
          repository: mirocosic/makonome
          token: ${{ secrets.MAKONOME_READ_TOKEN }}
          path: app
          sparse-checkout: docs/release-notes
          fetch-depth: 1
          # Don't leave the token in app/.git/config where npm install scripts could read it.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Byte limit on every served image, and no raw PNG/JPG <img> from public/. Cheap and
      # deterministic, so it runs on every event, including deploys from main.
      - name: Check image sizes
        run: npm run check:images

      # Lighthouse on a few pages (lighthouserc.json). PRs only, so a flaky score never blocks a deploy.
      - name: Lighthouse CI
        if: github.event_name == 'pull_request'
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
