name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check MAKONOME_READ_TOKEN
        env:
          MAKONOME_READ_TOKEN: ${{ secrets.MAKONOME_READ_TOKEN }}
        run: |
          if [ -z "$MAKONOME_READ_TOKEN" ]; then
            echo "::error::MAKONOME_READ_TOKEN missing or expired, see README"
            exit 1
          fi

      - name: Checkout app repo (release notes)
        uses: actions/checkout@v4
        with:
          repository: mirocosic/makonome
          token: ${{ secrets.MAKONOME_READ_TOKEN }}
          path: app
          sparse-checkout: docs/release-notes
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
